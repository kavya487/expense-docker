networks:
  expense: {}
volumes:
  mysql:
services:
  mysql:
    image: kavya478/mysql:1.0.0 
    networks:
    - expense
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql

  backend:
    image: kavya478/backend:1.0.0 
    command: sh -c "sleep 5 && node /opt/backend/index.js"
    networks:
    - expense
    container_name: backend
    depends_on:
    - mysql

  frontend:
    image: kavya478/frontend:1.0.0
    networks:
    - expense
    container_name: frontend
    ports:
    - 80:80
    depends_on:
    - backend